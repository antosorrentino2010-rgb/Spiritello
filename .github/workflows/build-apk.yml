name: Build Spiritelli APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Release APK
        run: gradle :app:assembleRelease

      - name: Find APK
        run: |
          echo "APK generati:"
          find app/build/outputs -type f -name "*.apk" -print

      - name: Find Android Build Tools
        id: tools
        run: |
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -n 1)
          echo "BUILD_TOOLS=$BUILD_TOOLS" >> "$GITHUB_OUTPUT"

      - name: Align APK
        run: |
          "${{ steps.tools.outputs.BUILD_TOOLS }}/zipalign" \
            -v -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app-release-aligned.apk

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore spiritelli-release.jks \
            -alias spiritelli \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass SpiritelliKey123 \
            -keypass SpiritelliKey123 \
            -dname "CN=Spiritelli, OU=Spiritelli, O=Spiritelli, L=Italy, ST=Italy, C=IT"

      - name: Sign APK
        run: |
          "${{ steps.tools.outputs.BUILD_TOOLS }}/apksigner" sign \
            --ks spiritelli-release.jks \
            --ks-key-alias spiritelli \
            --ks-pass pass:SpiritelliKey123 \
            --key-pass pass:SpiritelliKey123 \
            --out Spiritelli-installabile.apk \
            app-release-aligned.apk

      - name: Verify APK
        run: |
          "${{ steps.tools.outputs.BUILD_TOOLS }}/apksigner" verify --verbose Spiritelli-installabile.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Spiritelli-APK-INSTALLABILE
          path: Spiritelli-installabile.apk
          if-no-files-found: error
